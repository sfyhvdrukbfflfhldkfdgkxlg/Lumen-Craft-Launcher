name: Android build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['Alpha*', 'Beta*', 'RC*', 'v*', '[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Android build tools
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile all APKs and run regression suites
        shell: pwsh
        run: ./build.ps1 -Release -Unsigned
      - name: Select publication mode
        id: plan
        shell: pwsh
        run: |
          $v = python tools/package.py version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $candidate = Test-Path "dist/$v/SHA256SUMS.txt"
          $publish = $false
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF -ne "refs/tags/$v") { throw 'Tag must equal versionName' }
            $publish = $true
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main') {
            $exists = git tag --list $v
            $sameRevision = $exists -and ((git rev-parse "$v^{}") -eq $env:GITHUB_SHA)
            $publish = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -or ($candidate -and (!$exists -or $sameRevision))
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "needs_key=$(($publish -and !$candidate).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Sign with the repository release key
        if: steps.plan.outputs.needs_key == 'true'
        shell: pwsh
        env:
          LUMEN_KEYSTORE_BASE64: ${{ secrets.LUMEN_KEYSTORE_BASE64 }}
          LUMEN_KEY_ALIAS: ${{ secrets.LUMEN_KEY_ALIAS }}
          LUMEN_STORE_PASSWORD: ${{ secrets.LUMEN_STORE_PASSWORD }}
          LUMEN_KEY_PASSWORD: ${{ secrets.LUMEN_KEY_PASSWORD }}
        run: python tools/package.py sign
      - name: Compare signed candidates to the rebuilt release
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        run: python tools/package.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.plan.outputs.publish == 'true'
        with:
          name: verified-release
          path: dist/${{ steps.plan.outputs.version }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  upgrade:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: verified-release
      - name: Upgrade from Alpha1.0.0 on an Android emulator
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" "system-images;android-29;default;x86_64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n smoke -k "system-images;android-29;default;x86_64" --force <<< no
          "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/lumen-emulator.log" 2>&1 &
          runner_pid=$!
          trap 'kill "$runner_pid" || true' EXIT
          timeout 180 adb wait-for-device
          timeout 360 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell wm dismiss-keyguard
          python3 tools/upgrade_smoke.py "verified-release/LumenCraft-$VERSION-universal.apk" --baseline dist/LumenCraft-Alpha1.0.0.apk

  publish:
    needs: [build, upgrade]
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: verified-release
      - name: Publish verified assets and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish.py
